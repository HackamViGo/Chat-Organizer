version: '5.0.0'
description: 'Core hierarchy and governance'
fallback: 'docs/user/FallbackRules/00_META.md'

rules:
  hierarchy:
    - rule: 'PRIORITY_CHAIN'
      description: '01_CRITICAL > 03_CODE_STANDARDS > 04_AGENT_PROTOCOL > 02_WORKFLOW'
    - rule: 'CONFLICT_RESOLUTION'
      description: 'Local config overrides global. Security overrides code style.'

  file_ownership:
    - path: 'apps/extension'
      role: 'EXTENSION_ENGINEER'
    - path: 'apps/dashboard'
      role: 'FRONTEND_ENGINEER'
    - path: 'packages/*'
      role: 'ARCHITECT'
    - path: 'supabase/*'
      role: 'BACKEND_ENGINEER'

  repository_structure:
    - rule: 'DOCUMENTATION_BOUNDARY'
      description: 'All documentation (manuals, guides, archives) MUST live inside `docs/`. No .md or .txt files allowed in /apps, /packages, or root (except README and .agent).'
    - rule: 'ARCHIVE_PATH'
      description: 'History and legacy migrations move to `docs/archive/pre-migration-YYYYMMDD/` instead of root /archive/.'

  fallback_protocol:
    - rule: "NOTIFY_ON_FALLBACK"
      description: "If an agent accesses any .md file in docs/user/FallbackRules/, they MUST immediately notify the user in Bulgarian: 'ВНИМАНИЕ: Използвам FALLBACK правила поради [причина]!'"

  emergency_override:
    - condition: 'Production is down or security vulnerability'
      action: 'Bypass normal rules, fix immediately, document in logs/violations.json'
