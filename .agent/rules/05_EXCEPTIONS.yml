version: '5.0.0'
priority: 'CRITICAL'
description: 'Rules for bending the rules (Exceptions Protocol)'
fallback: 'docs/user/FallbackRules/05_EXCEPTIONS.md'

rules:
  hotfix:
    - rule: 'EMERGENCY_OVERRIDE'
      description: 'Agents may bypass verification limits (like >80 verify score) ONLY for production outages, via branch `hotfix/...` and `git commit --no-verify`.'
    - rule: 'DOCUMENT_VIOLATION'
      description: 'Every override MUST be registered in .agent/logs/violations.json with the reason, risk, and normalization plan.'
    - rule: 'TEMPORARY_MEASURE'
      description: 'An exception is never permanent. It demands a follow-up ticket/task to normalize.'

  legacy_migration:
    - rule: 'GRADUAL_REFACTOR'
      description: 'If old code severely violates typing rules, quarantine it rather than blowing scope to rewrite everything, but document the technical debt.'
