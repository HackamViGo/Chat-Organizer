version: '5.0.0'
priority: 'CRITICAL'
description: 'Non-negotiable security and architecture constraints'
fallback: 'docs/user/FallbackRules/01_CRITICAL.md'

rules:
  security:
    - rule: 'NO_CLIENT_SECRETS'
      description: 'Never expose API keys (e.g., Supabase service role, Gemini) to the client. Use server routes.'
    - rule: 'USER_ID_SOURCE'
      description: 'user_id must come from auth.getUser() server-side, never from API request body.'
    - rule: 'RLS_MANDATORY'
      description: 'Row Level Security must be enabled and enforced on all Supabase tables.'

  type_safety:
    - rule: 'NO_ANY'
      description: "'any' type is forbidden. Use 'unknown' with type guards."
    - rule: 'ZOD_SCHEMAS'
      description: 'All validation must use Zod schemas located in @brainbox/validation.'

  architecture:
    - rule: 'STRICT_BOUNDARIES'
      description: 'Extension CANNOT import from Dashboard. Dashboard CANNOT import from Extension. Share logic via packages/.'

  package_manager:
    - rule: 'PNPM_ONLY'
      description: 'Only use pnpm. npm and yarn are forbidden. Revert package-lock.json if found.'
